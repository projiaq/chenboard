name: Build and Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'deployments/docker/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]

jobs:
  # 测试
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Run tests
        working-directory: backend
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.out
          flags: backend

  # 编译
  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Build auth-service
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -a -installsuffix cgo -ldflags="-w -s" -o bin/auth-service ./cmd/auth-service
          ls -lh bin/
          file bin/auth-service

      - name: Test binary
        working-directory: backend
        run: |
          chmod +x bin/auth-service
          ./bin/auth-service --help || echo "Binary created successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-linux-amd64
          path: backend/bin/auth-service
          retention-days: 7

  # Docker 构建
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/auth-service.Dockerfile
          push: false
          tags: iot-platform/auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker images | grep iot-platform
          docker run --rm iot-platform/auth-service:latest --help || echo "Docker image created successfully"

  # 集成测试
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: docker-build
    services:
      postgres:
        image: postgres:16.1-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iot_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Install migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate
          chmod +x /usr/local/bin/migrate

      - name: Run migrations
        working-directory: backend/migrations/auth
        run: |
          migrate -path . -database "postgresql://postgres:postgres@localhost:5432/iot_platform?sslmode=disable" up

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: auth-service-linux-amd64
          path: backend/bin/

      - name: Start auth-service
        working-directory: backend
        env:
          SERVER_HOST: 0.0.0.0
          SERVER_PORT: 8081
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: iot_platform
          DB_SSLMODE: disable
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key
          LOG_LEVEL: info
        run: |
          chmod +x bin/auth-service
          ./bin/auth-service &
          sleep 5

      - name: Health check
        run: |
          curl -f http://localhost:8081/health || exit 1

      - name: Test login API
        run: |
          response=$(curl -s -X POST http://localhost:8081/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin123","tenant_id":"default"}')
          echo "Response: $response"
          echo "$response" | jq -e '.code == 0' || exit 1
          echo "✅ Login test passed"

      - name: Test invalid login
        run: |
          response=$(curl -s -X POST http://localhost:8081/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"wrong","tenant_id":"default"}')
          echo "Response: $response"
          echo "$response" | jq -e '.code != 0' || exit 1
          echo "✅ Invalid login test passed"
