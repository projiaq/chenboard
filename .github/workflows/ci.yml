name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 检查代码格式
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2

      - name: Run golangci-lint
        run: |
          cd services/auth-service
          golangci-lint run --timeout=5m

  # 构建和测试 pkg
  test-pkg:
    name: Test Shared Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download dependencies
        run: |
          cd pkg
          go mod download

      - name: Run tests
        run: |
          cd pkg
          go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./pkg/coverage.out
          flags: pkg

  # 构建和测试 auth-service
  test-auth-service:
    name: Test Auth Service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iot_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate
          chmod +x /usr/local/bin/migrate

      - name: Run migrations
        run: |
          cd services/auth-service
          migrate -path migrations -database "postgresql://postgres:postgres@localhost:5432/iot_platform_test?sslmode=disable" up

      - name: Download dependencies
        run: |
          cd services/auth-service
          go mod download

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: iot_platform_test
          DB_SSLMODE: disable
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key
        run: |
          cd services/auth-service
          go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/auth-service/coverage.out
          flags: auth-service

  # 构建 auth-service
  build-auth-service:
    name: Build Auth Service
    runs-on: ubuntu-latest
    needs: [lint, test-auth-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: |
          cd services/auth-service
          CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -o bin/auth-service ./cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service
          path: services/auth-service/bin/auth-service

  # 集成测试
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [build-auth-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services
        run: |
          docker-compose up -d postgres redis
          sleep 10

      - name: Install migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate
          chmod +x /usr/local/bin/migrate

      - name: Run migrations
        run: |
          cd services/auth-service
          migrate -path migrations -database "postgresql://postgres:postgres@localhost:5432/iot_platform?sslmode=disable" up

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: auth-service
          path: services/auth-service/bin/

      - name: Make binary executable
        run: chmod +x services/auth-service/bin/auth-service

      - name: Start auth-service
        env:
          SERVER_HOST: 0.0.0.0
          SERVER_PORT: 8081
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: iot_platform
          DB_SSLMODE: disable
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key
          LOG_LEVEL: info
        run: |
          cd services/auth-service
          ./bin/auth-service &
          sleep 5

      - name: Health check
        run: |
          curl -f http://localhost:8081/health || exit 1

      - name: Test login
        run: |
          response=$(curl -s -X POST http://localhost:8081/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin123","tenant_id":"default"}')
          echo $response
          echo $response | jq -e '.code == 0' || exit 1

      - name: Stop services
        if: always()
        run: docker-compose down
